<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="四川高校大模型门户 - 充值收银台" />
  <title>收银台 - 四川高校大模型门户</title>
  <link rel="stylesheet" href="vendor/layui/css/layui.css" />
  <link rel="stylesheet" href="css/app.css?v=20260906-1" />
  <style>
    body.pay-page { background: #f4f6fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .pay-card { width: 100%; max-width: 460px; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(31, 45, 90, .08); padding: 32px; box-sizing: border-box; }
    .pay-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #1f2d5a; text-decoration: none; margin-bottom: 24px; }
    .pay-title { font-size: 20px; margin: 0 0 4px; color: #1f2d5a; }
    .pay-sub { color: #8a93a8; font-size: 13px; margin: 0 0 20px; }
    .pay-rows { border-top: 1px solid #eef1f7; margin-bottom: 20px; }
    .pay-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eef1f7; font-size: 14px; color: #4b5468; }
    .pay-row .val { color: #1f2d5a; font-weight: 500; }
    .pay-row .val.point { color: #2f6bff; font-weight: 700; }
    .pay-status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .pay-status.pending { background: #fff7e6; color: #b8860b; }
    .pay-status.paid { background: #e8f7ee; color: #179b4b; }
    .pay-actions { display: flex; flex-direction: column; gap: 12px; }
    .btn-block { width: 100%; padding: 12px 16px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
    .btn-pay { background: linear-gradient(135deg, #2f6bff, #1652f0); color: #fff; }
    .btn-pay:hover { filter: brightness(1.05); }
    .btn-goto { background: #fff; border: 1px solid #d8deea !important; color: #1f2d5a; }
    .pay-success { text-align: center; padding: 8px 0 4px; }
    .pay-success .icon { font-size: 48px; color: #179b4b; margin-bottom: 8px; }
    .pay-success .points { font-size: 26px; color: #1f2d5a; font-weight: 700; margin: 6px 0 2px; }
    .pay-error { color: #d64545; font-size: 13px; min-height: 18px; margin: 10px 0 0; }
    .pay-back { text-align: center; margin-top: 16px; }
    .pay-back a { color: #2f6bff; text-decoration: none; font-size: 14px; }
    .pay-tip { background: #f6f8fd; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #8a93a8; margin-bottom: 16px; line-height: 1.6; }
    .pay-count { color: #8a93a8; font-size: 12px; text-align: center; margin-top: 8px; }
  </style>
</head>
<body class="pay-page">
  <main class="pay-card" aria-label="充值收银台">
    <a class="pay-brand" href="index.html"><i class="layui-icon layui-icon-light"></i><span>四川高校大模型门户</span></a>

    <section id="pay-detail">
      <h1 class="pay-title">收银台</h1>
      <p class="pay-sub">订单信息确认</p>
      <div class="pay-rows">
        <div class="pay-row"><span>支付金额</span><span class="val" id="pay-amount">--</span></div>
        <div class="pay-row"><span>订单编号</span><span class="val" id="pay-order-no">--</span></div>
        <div class="pay-row"><span>支付方式</span><span class="val" id="pay-method">--</span></div>
        <div class="pay-row"><span>订单状态</span><span class="pay-status pending" id="pay-status">--</span></div>
      </div>
      <div class="pay-tip" id="pay-tip"></div>
      <div class="pay-actions" id="pay-actions"></div>
      <p class="pay-count" id="pay-count"></p>
      <p class="pay-error" id="pay-error" role="alert"></p>
      <p class="pay-back"><a href="profile.html">返回个人中心</a></p>
    </section>

    <section id="pay-success" hidden>
      <div class="pay-success">
        <div class="icon"><i class="layui-icon layui-icon-ok-circle"></i></div>
        <p class="pay-sub">支付成功，金额已到账</p>
        <p class="points" id="success-points">+¥0.00</p>
      </div>
      <div class="pay-actions" style="margin-top:18px;">
        <a class="btn-block btn-pay" href="profile.html" style="text-align:center;text-decoration:none;">返回个人中心</a>
      </div>
    </section>
  </main>

  <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
  <script src="js/config.js?v=20260907-7"></script>
  <script src="js/api.js?v=20260907-7"></script>
  <script src="js/pay.js?v=20260907-7"></script>
</body>
</html>
